name: Deploy
# Builds docs.nimstead.systems from this repo (builder, Pulse pages) and Nimstead/assure's main (Assure pages), tests it,
# and publishes it to Cloudflare. Every hour it checks whether Assure's docs moved on, so the site can't fall behind
# silently: it redeploys when the Assure commit the live site names differs from main's.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: "false"
      DOCS_SOURCE_REF: main
    steps:
      # actions pinned to commit SHAs, as in Nimstead/assure
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: Nimstead/assure
          ref: main
          path: assure
          persist-credentials: false
      - name: Is the live site already current?
        id: live
        if: github.event_name == 'schedule'
        run: |
          live=$(curl -fsS https://docs.nimstead.systems/how-to/deploy-server/ | grep -oE 'Nimstead/assure/tree/[0-9a-f]{40}' | head -1 | cut -d/ -f4 || true)
          main=$(git -C assure rev-parse HEAD)
          echo "live site: ${live:-unknown}; assure main: $main"
          if [ "$live" = "$main" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        if: steps.live.outputs.current != 'true'
        with:
          node-version: 24  # cf needs 22.18 or later
          cache: npm
      - if: steps.live.outputs.current != 'true'
        run: npm ci
      - if: steps.live.outputs.current != 'true'
        run: npm run build  # fails on a missing page, link or heading target
      - if: steps.live.outputs.current != 'true'
        run: npm test
      - if: steps.live.outputs.current != 'true'
        run: npx cf build
      - if: steps.live.outputs.current != 'true'
        run: npx cf deploy --prebuilt --dry-run
      - name: Publish
        if: steps.live.outputs.current != 'true' && github.event_name != 'pull_request'
        run: npx cf deploy --prebuilt --message "assure $(git -C assure rev-parse --short HEAD), docs $(git rev-parse --short HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
